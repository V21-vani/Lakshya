# Server Configuration
# Controllers already map under /api/..., so no servlet context-path here.
# Hosts like Render pass the port in $PORT
server.port=${PORT:8080}

# Database (default: H2 file database, zero setup; data lives in backend/data/)
# Run with --spring.profiles.active=mysql to use MySQL instead (see application-mysql.properties).
spring.datasource.url=jdbc:h2:file:./data/lakshya;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# Turned off in the cloud (H2_CONSOLE=false): a public console would expose the database
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration (secret must be at least 32 characters; override with env var JWT_SECRET)
jwt.secret=${JWT_SECRET:placement_mentoring_secret_key_2026_secure_application}
# 7 days in milliseconds
jwt.expiration=604800000

# CORS: comma-separated frontend origins allowed to call the API. Wildcards work,
# e.g. CORS_ORIGINS=https://*.vercel.app for every Vercel deployment.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# OpenAPI / Swagger UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.root=info
logging.level.com.lakshya.backend=debug
logging.level.org.springframework.security=info
