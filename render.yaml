# Render Blueprint: New -> Blueprint -> pick this repo. Deploys the Spring Boot backend.
services:
  - type: web
    name: lakshya-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/problems
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://*.vercel.app,http://localhost:5173
      - key: H2_CONSOLE
        value: "false"
