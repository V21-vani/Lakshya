# ===== Server =====
server.port=8082
spring.application.name=placement-services

# ===== Database (H2 for standalone testing; switch to MySQL when merging with Member 1) =====
spring.datasource.url=jdbc:h2:mem:placementdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===== Judge0 =====
# Free public instance (rate limited). For RapidAPI use https://judge0-ce.p.rapidapi.com and set the key.
judge0.base-url=https://ce.judge0.com
judge0.api-key=${JUDGE0_API_KEY:}
judge0.api-host=judge0-ce.p.rapidapi.com
judge0.timeout-seconds=30

# ===== Mail (Gmail SMTP: use an App Password, never your real password) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== CORS origins allowed to call this service (React/Vite dev servers) =====
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
